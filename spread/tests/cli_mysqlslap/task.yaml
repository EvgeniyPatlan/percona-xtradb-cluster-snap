summary: Percona Server mysqlslap CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-xtradb-cluster/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysql slap"

  CMD="percona-xtradb-cluster.mysqlslap -u root"

  ${CMD} -a --auto-generate-sql-guid-primary --auto-generate-sql-execute-number=10

restore: |
  snap remove percona-xtradb-cluster --purge --terminate
