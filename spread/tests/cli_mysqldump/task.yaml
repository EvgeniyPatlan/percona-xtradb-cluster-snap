summary: Percona XtraDB Cluster mysqldump CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-xtradb-cluster/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysqldump"

  CMD="percona-xtradb-cluster.mysql -u root"
  # --single-transaction is required here, not optional: PXC's default
  # pxc_strict_mode=ENFORCING rejects mysqldump's LOCK TABLES fallback
  # outright (CI-proven: "mysqldump: Got error: 1105: Percona-XtraDB-Cluster
  # prohibits use of LOCK TABLE/FLUSH TABLE <table> WITH READ LOCK/FOR
  # EXPORT with pxc_strict_mode = ENFORCING when using LOCK TABLES" when
  # this flag was dropped). Keep it.
  CMD_DUMP="percona-xtradb-cluster.mysqldump -u root --single-transaction"

  echo "Creating test db"
  ${CMD} -e "CREATE DATABASE test_db;"
  ${CMD} -e "USE test_db; CREATE TABLE test_table (id INT PRIMARY KEY, name VARCHAR(50));"
  ${CMD} -e "INSERT INTO test_db.test_table (id, name) VALUES (1, 'test_name');"

  echo "Dump test db"
  # This suite verifies the mysqldump binary works against the cluster, not
  # that a logical dump can be replayed back into the same live server:
  # under pxc_strict_mode=ENFORCING, replaying a mysqldump'd LOCK
  # TABLES/UNLOCK TABLES pair (mysqldump's --add-locks default) is not a
  # supported workflow on Percona XtraDB Cluster. XtraBackup (shipped in
  # this snap for exactly this purpose) is PXC's supported backup/restore
  # path; there is no restore-round-trip suite in this repo yet, so this
  # test is deliberately dump-content-only rather than pretending to cover
  # restore. --set-gtid-purged=OFF keeps the dump free of a GTID_PURGED
  # statement that has no purpose in a dump that is never restored.
  #
  # Route the confined app's stdout through `cat` before the file
  # redirect rather than redirecting it directly. CI-proven (this task,
  # runs 32787365109/32788700771, both arches): a direct
  # `mysqldump ... >test_db.sql` silently produces a 0-byte file --
  # exit 0, no stderr, no error of any kind -- while the exact same
  # command against the exact same live cluster produces a correct,
  # non-empty dump when run unconfined (direct-exec repro, outside
  # snapd). The sibling suites in mysql-snap, percona-server-mysql-snap,
  # and percona-distribution-mysql-ps-snap all already pipe their
  # confined mysqldump's stdout through `cat` rather than redirecting it
  # directly, and an independent, parallel investigation in the sibling
  # percona-distribution-mysql-pxc-snap repo hit the identical symptom
  # and confirmed the identical `| cat` fix (commit 4b2e1d2). Most likely
  # mechanism: mysqldump's own AppArmor/mount-namespace confinement
  # silently fails to write to the pre-opened regular-file fd inherited
  # from the redirect; a pipe into an unconfined `cat` sidesteps that
  # entirely, since `cat` (not part of this snap) does the real file
  # write. Not chased to the exact kernel-level mechanism -- that needs a
  # live confined-node strace -- but the workaround is CI-provable and
  # matches the already-proven convention used everywhere else in this
  # family of snaps.
  ${CMD_DUMP} --set-gtid-purged=OFF --databases test_db | cat >test_db.sql

  echo "Verify dump content"
  grep -q "CREATE TABLE" test_db.sql
  grep -q "test_name" test_db.sql

  ${CMD} -e "DROP DATABASE test_db;"

restore: |
  snap remove percona-xtradb-cluster --purge --terminate
