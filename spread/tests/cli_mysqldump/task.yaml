summary: Percona XtraDB Cluster mysqldump CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-xtradb-cluster/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysqldump"

  CMD="percona-xtradb-cluster.mysql -u root"
  CMD_DUMP="percona-xtradb-cluster.mysqldump -u root --single-transaction"

  echo "Creating test db"
  ${CMD} -e "CREATE DATABASE test_db;"
  ${CMD} -e "USE test_db; CREATE TABLE test_table (id INT PRIMARY KEY, name VARCHAR(50));"
  ${CMD} -e "INSERT INTO test_db.test_table (id, name) VALUES (1, 'test_name');"

  echo "Dump test db"
  # Restoring below targets the same live server, whose binary logs still
  # hold every GTID this task just generated (none purged). A dump that
  # embeds SET @@GLOBAL.GTID_PURGED would collide with that GTID_EXECUTED
  # set (ERROR 3546) on restore, aborting the whole batch on its first
  # statement (mysql stops on error by default) -- which is why the restore
  # looked like a silent no-op and the later SELECT saw "Unknown database".
  # This is a plain CLI round-trip check, not a GTID-preservation test, so
  # drop the GTID_PURGED statement entirely (see percona-server-mysql-snap's
  # cli_mysqldump task for the same fix).
  ${CMD_DUMP} --set-gtid-purged=OFF --databases test_db >test_db.sql

  echo "Drop test db"
  ${CMD} -e "DROP DATABASE test_db;"

  echo "Restore test db"
  cat test_db.sql | ${CMD}

  ${CMD} -e "SELECT * FROM test_db.test_table WHERE id = 1;"

  ${CMD} -e "DROP DATABASE test_db;"

restore: |
  snap remove percona-xtradb-cluster --purge --terminate
