summary: Percona Server upgrade tests

# TODO(release): remove `manual` once percona-xtradb-cluster is published to 8.4/edge
manual: true

prepare: |
  snap install percona-xtradb-cluster --channel 8.4/edge
  until [ -S /var/snap/percona-xtradb-cluster/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Creating test data..."

  CMD="percona-xtradb-cluster.mysql -u root"

  ${CMD} --execute="
    CREATE DATABASE test_db;
    CREATE TABLE test_db.test (id SERIAL PRIMARY KEY, name TEXT);
    INSERT INTO test_db.test (name) VALUES ('test1');
    SELECT * FROM test_db.test;
  "

  echo "Upgrading to local snap..."
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-xtradb-cluster/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

  echo "Checking test data after installation..."
  ${CMD} --execute="SELECT * FROM test_db.test;"

restore: |
  snap remove percona-xtradb-cluster --purge --terminate
