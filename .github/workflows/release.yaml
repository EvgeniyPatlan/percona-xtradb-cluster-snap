name: Release to Snap Store

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 8.4/edge
    paths:
      - snap/**
  workflow_dispatch:

# Both jobs are gated on the repository variable RELEASE_ENABLED.
# Set RELEASE_ENABLED=true (Settings → Secrets and variables → Actions → Variables)
# after registering the Snap Store name and adding the SNAP_STORE_TOKEN secret.
jobs:
  build:
    name: Build snap
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v50
    permissions:
      contents: read

  release:
    name: Release snap
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    needs:
      - build
    uses: canonical/data-platform-workflows/.github/workflows/release_snap_edge.yaml@v50
    with:
      track: '8.4'
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN }}
    permissions:
      contents: write  # Needed to create git tags
